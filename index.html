<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<title>Menú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#1f3a5f;        /* azul horno: marca */
    --azul-2:#2c4f7c;
    --dorado:#e0a43a;      /* corteza dorada: acentos */
    --harina:#f7f6f3;      /* fondo */
    --blanco:#ffffff;
    --tinta:#1b2330;       /* texto */
    --gris:#667085;        /* texto secundario */
    --linea:#e7e4de;
    --wa:#1faa59;
    --radio:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Figtree',system-ui,sans-serif;background:var(--harina);color:var(--tinta);line-height:1.5;font-size:15px}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus-visible{outline:3px solid var(--dorado);outline-offset:2px;border-radius:6px}

  .demo{background:var(--dorado);color:var(--tinta);text-align:center;font-size:13px;font-weight:600;padding:8px 16px}

  /* Portada */
  header{background:var(--azul);color:var(--blanco);padding:28px 20px 30px;position:relative;overflow:hidden}
  header::before{ /* trigo en la esquina */
    content:"";position:absolute;right:-30px;top:-20px;width:190px;height:190px;opacity:.10;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='white' stroke-width='3' stroke-linecap='round'><path d='M50 95V20'/><path d='M50 30c-8-2-12-9-12-16 8 2 12 9 12 16zM50 30c8-2 12-9 12-16-8 2-12 9-12 16zM50 48c-8-2-12-9-12-16 8 2 12 9 12 16zM50 48c8-2 12-9 12-16-8 2-12 9-12 16zM50 66c-8-2-12-9-12-16 8 2 12 9 12 16zM50 66c8-2 12-9 12-16-8 2-12 9-12 16z'/></svg>") no-repeat center/contain;
  }
  .wrap{max-width:680px;margin:0 auto;position:relative}
  .marca{display:flex;align-items:center;gap:14px}
  .sello{flex:0 0 56px;height:56px;border-radius:50%;background:var(--dorado);display:grid;place-items:center}
  .sello svg{width:30px;height:30px}
  h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;line-height:1.1;letter-spacing:-.5px}
  .lema{color:#c9d5e6;font-size:14px;margin-top:2px}
  .datos{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:20px;font-size:13.5px;color:#dbe4f0}
  .datos span{display:inline-flex;align-items:center;gap:6px}
  .punto{width:8px;height:8px;border-radius:50%;background:#9aa7b8}
  .punto.on{background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}

  /* Buscador y categorías */
  .barra{position:sticky;top:0;z-index:10;background:var(--harina);border-bottom:1px solid var(--linea)}
  .buscar{padding:14px 16px 6px}
  .buscar label{position:relative;display:block}
  .buscar svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--gris)}
  .buscar input{width:100%;font:inherit;padding:11px 14px 11px 42px;border:1px solid var(--linea);border-radius:999px;background:var(--blanco);color:var(--tinta)}
  .buscar input:focus{outline:none;border-color:var(--azul-2)}
  .tabs{display:flex;gap:22px;overflow-x:auto;padding:4px 16px 0;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto;padding:10px 0 12px;font-weight:600;color:var(--gris);border-bottom:3px solid transparent;white-space:nowrap}
  .tabs button.activo{color:var(--azul);border-bottom-color:var(--dorado)}

  main{padding:0 16px 130px}

  /* Destacado */
  .destacado{margin-top:22px;background:var(--blanco);border:1px solid var(--linea);border-radius:18px;padding:18px;display:flex;gap:16px;align-items:center}
  .destacado .ico{flex:0 0 64px;height:64px;border-radius:16px;background:#fbf1de;display:grid;place-items:center;color:#b07614}
  .destacado .ico svg{width:34px;height:34px}
  .destacado h3{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;color:var(--azul)}
  .destacado p{font-size:14px;color:var(--gris)}

  /* Productos */
  section{padding-top:26px;scroll-margin-top:122px}
  h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;color:var(--azul);margin-bottom:6px}
  .lista{background:var(--blanco);border:1px solid var(--linea);border-radius:18px;overflow:hidden}
  .prod{display:flex;align-items:center;gap:14px;padding:14px 14px 14px 14px}
  .prod + .prod{border-top:1px solid var(--linea)}
  .mini{flex:0 0 58px;height:58px;border-radius:12px;background:#eef2f7;display:grid;place-items:center;color:var(--azul-2);overflow:hidden}
  .mini svg{width:30px;height:30px}
  .mini img{width:100%;height:100%;object-fit:cover}
  .info{flex:1;min-width:0}
  .info h3{font-size:15.5px;font-weight:700;line-height:1.3}
  .info p{font-size:13px;color:var(--gris);margin-top:1px}
  .tag{display:block;width:fit-content;margin:3px 0 2px;font-size:11.5px;font-weight:600;color:#8a5a0c;background:#fbf1de;padding:1px 8px;border-radius:999px;vertical-align:1px}
  .precio{font-weight:700;color:var(--tinta);margin-top:4px;font-size:14.5px}
  .ctl{display:flex;align-items:center;gap:8px}
  .ctl button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:600;line-height:1}
  .mas{background:var(--azul);color:var(--blanco)}
  .menos{border:1.5px solid var(--linea);color:var(--azul)}
  .cant{min-width:18px;text-align:center;font-weight:700}
  .consultar{font-size:13px;font-weight:600;color:var(--azul-2);border:1.5px solid var(--linea);padding:7px 12px;border-radius:999px}
  .vacio{padding:30px 16px;text-align:center;color:var(--gris)}

  /* Información */
  .ficha{margin-top:26px;background:var(--azul);color:var(--blanco);border-radius:18px;padding:20px}
  .ficha h2{color:var(--blanco)}
  .fila{display:flex;gap:12px;padding:10px 0;border-top:1px solid rgba(255,255,255,.14);font-size:14px}
  .fila:first-of-type{border-top:0}
  .fila b{flex:0 0 88px;color:#c9d5e6;font-weight:500}
  .fila a{color:var(--dorado);font-weight:600}
  footer{text-align:center;color:var(--gris);font-size:12.5px;padding:22px 0 0}

  /* Barra de pedido */
  .pedido{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--harina) 70%,rgba(247,246,243,0))}
  .pedido a{max-width:648px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--wa);color:#fff;text-decoration:none;border-radius:16px;padding:14px 18px;font-weight:700;box-shadow:0 8px 24px rgba(20,60,40,.22)}
  .pedido .bolsa{background:rgba(255,255,255,.2);border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-size:14px;padding:0 8px}
  .pedido .txt{flex:1}
  .pedido .total{font-size:16px}
  @media (prefers-reduced-motion:no-preference){ .pedido a{transition:transform .15s} .pedido a.pulso{transform:scale(1.03)} }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="marca">
      <div class="sello" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" stroke="#1f3a5f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17c0-5 5-9 11-9s11 4 11 9c0 2-1 3-3 3v4a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2v-4c-2 0-3-1-3-3z"/><path d="M12 13l-1 4M17 12v4M22 13l1 4"/></svg>
      </div>
      <div>
        <h1 id="nombre"></h1>
        <p class="lema" id="lema"></p>
      </div>
    </div>
    <div class="datos">
      <span><i class="punto" id="punto"></i><span id="estado"></span></span>
      <span id="horaCorta"></span>
      <span id="zona"></span>
    </div>
  </div>
</header>

<div class="barra">
  <div class="wrap">
    <div class="buscar">
      <label>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Buscar pan, pastel, bebida…" aria-label="Buscar en el menú">
      </label>
    </div>
    <nav class="tabs" id="tabs" aria-label="Categorías"></nav>
  </div>
</div>

<main>
  <div class="wrap" id="contenido"></div>
</main>

<div class="pedido">
  <a id="wa" href="#" rel="noopener">
    <span class="bolsa" id="bolsa">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2s-1 .2-3.4-.8a11.6 11.6 0 0 1-4.5-4c-.3-.5-1-1.5-1-2.8s.7-2 1-2.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.2-.3.3-.1.6a8 8 0 0 0 1.5 1.8 7 7 0 0 0 2 1.3c.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.4.2.5.3s0 .8-.2 1.3z"/></svg>
    </span>
    <span class="txt" id="waTxt">Pedir por WhatsApp</span>
    <span class="total" id="total"></span>
  </a>
</div>

<script>
/* =====================================================
   DATOS DEL NEGOCIO: cambia solo esta parte para cada cliente
   - whatsapp vacío = modo ejemplo (muestra la franja de "ejemplo")
   - foto: link de una imagen del producto (opcional)
   - precio: número, o null si es "consultar"
   ===================================================== */
var NEGOCIO = {
  nombre: "Tu Panadería",
  lema: "Pan recién horneado todos los días",
  zona: "Tu barrio, Quito",
  direccion: "Aquí va la dirección de tu local",
  mapa: "",                 // link de Google Maps (vacío = no se muestra)
  whatsapp: "",             // 593 + número sin el 0, ej: 593991234567
  abre: 6, cierra: 21,      // horario en formato 24h (21.5 = 21:30)
  horario: "Todos los días, de 6:00 a 21:00",
  destacado: {
    titulo: "Pasteles por encargo",
    texto: "Cumpleaños, bautizos y reuniones. Elige sabor y decoración y pídelo con dos días de anticipación."
  },
  categorias: [
    { id:"panes", nombre:"Panes", icono:"pan", productos:[
      { n:"Pan de agua", d:"Crocante por fuera, suave por dentro", precio:0.15, tag:"Recién salido" },
      { n:"Pan de yema", d:"El clásico de la mañana", precio:0.15 },
      { n:"Enrollado de queso", d:"Relleno de queso fresco", precio:0.25 },
      { n:"Pan de leche", d:"Suave, ideal para el café", precio:0.15 },
      { n:"Pan integral", d:"Con avena y semillas", precio:0.20 }
    ]},
    { id:"dulces", nombre:"Dulces", icono:"dulce", productos:[
      { n:"Cachos", d:"Dorados, con azúcar por encima", precio:0.25, tag:"El más pedido" },
      { n:"Empanada de viento", d:"Con queso y azúcar", precio:0.50 },
      { n:"Orejas", d:"Hojaldre caramelizado", precio:0.30 },
      { n:"Rosquitas", d:"Para acompañar la tarde", precio:0.20 }
    ]},
    { id:"pasteles", nombre:"Pasteles", icono:"pastel", productos:[
      { n:"Tres leches", d:"Porción individual", precio:1.25 },
      { n:"Pastel de chocolate", d:"Porción con cobertura", precio:1.25 },
      { n:"Torta de naranja", d:"Entera, para compartir", precio:6.00 },
      { n:"Pastel personalizado", d:"Para cumpleaños y eventos", precio:null }
    ]},
    { id:"bebidas", nombre:"Bebidas", icono:"taza", productos:[
      { n:"Café pasado", d:"Taza caliente", precio:0.75 },
      { n:"Chocolate caliente", d:"Con leche entera", precio:0.75 },
      { n:"Jugo natural", d:"Mora, naranja o naranjilla", precio:1.00 }
    ]}
  ]
};
/* ===================================================== */

var ICONOS = {
  pan:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17c0-5 5-9 11-9s11 4 11 9c0 2-1 3-3 3v4a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2v-4c-2 0-3-1-3-3z"/><path d="M12 13l-1 4M17 12v4M22 13l1 4"/></svg>',
  dulce:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 9c-4 0-6 3-6 7s2 7 6 7 6-3 6-7-2-7-6-7z"/><path d="M10 16c-3 0-5-2-5-4 3 0 5 1 5 4zM22 16c3 0 5-2 5-4-3 0-5 1-5 4zM13 10l1.5 12M19 10l-1.5 12"/></svg>',
  pastel:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 26h20V16H6z"/><path d="M6 20c2 1.5 4 1.5 5 0 1 1.5 4 1.5 5 0 1 1.5 4 1.5 5 0 1 1.5 3 1.5 5 0"/><path d="M11 16v-3M16 16v-3M21 16v-3"/><path d="M11 10c-.7-1 0-2 0-3 .7 1 .7 2 0 3zM16 10c-.7-1 0-2 0-3 .7 1 .7 2 0 3zM21 10c-.7-1 0-2 0-3 .7 1 .7 2 0 3z"/></svg>',
  taza:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 13h16v7a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6z"/><path d="M22 15h2a3 3 0 0 1 0 6h-2"/><path d="M11 5c-1 1.5 1 2.5 0 4M16 5c-1 1.5 1 2.5 0 4"/></svg>'
};

var N = NEGOCIO, carrito = {};
var dinero = function(v){ return "$" + v.toFixed(2).replace(".", ","); };
var $ = function(id){ return document.getElementById(id); };

document.title = N.nombre + " · Menú";
$("nombre").textContent = N.nombre;
$("lema").textContent = N.lema;
$("zona").textContent = N.zona;
$("horaCorta").textContent = "Hasta las " + Math.floor(N.cierra) + ":" + (N.cierra % 1 ? "30" : "00");

var ahora = new Date(), h = ahora.getHours() + ahora.getMinutes()/60;
var abierto = h >= N.abre && h < N.cierra;
$("estado").textContent = abierto ? "Abierto ahora" : "Cerrado ahora";
if (abierto) $("punto").classList.add("on");

if (!N.whatsapp) {
  var demo = document.createElement("div");
  demo.className = "demo";
  demo.textContent = "Menú de ejemplo: así se vería con el nombre, fotos y precios de tu negocio";
  document.body.insertBefore(demo, document.body.firstChild);
}

/* Construir el menú */
var cont = $("contenido"), tabs = $("tabs");

var dz = document.createElement("div");
dz.className = "destacado";
dz.innerHTML = '<div class="ico">' + ICONOS.pastel + '</div><div><h3></h3><p></p></div>';
dz.querySelector("h3").textContent = N.destacado.titulo;
dz.querySelector("p").textContent = N.destacado.texto;
cont.appendChild(dz);

N.categorias.forEach(function(c, i){
  var b = document.createElement("button");
  b.textContent = c.nombre; b.dataset.ir = c.id;
  if (i === 0) b.classList.add("activo");
  b.onclick = function(){ $(c.id).scrollIntoView({behavior:"smooth"}); };
  tabs.appendChild(b);

  var s = document.createElement("section"); s.id = c.id;
  var h2 = document.createElement("h2"); h2.textContent = c.nombre; s.appendChild(h2);
  var lista = document.createElement("div"); lista.className = "lista";

  c.productos.forEach(function(p, j){
    var key = c.id + "-" + j;
    p.key = key;
    var row = document.createElement("div");
    row.className = "prod"; row.dataset.buscar = (p.n + " " + p.d).toLowerCase();
    row.innerHTML = '<div class="mini"></div><div class="info"><h3></h3><p></p><div class="precio"></div></div><div class="ctl"></div>';
    var mini = row.querySelector(".mini");
    if (p.foto) { var im = document.createElement("img"); im.src = p.foto; im.alt = p.n; im.loading = "lazy"; mini.appendChild(im); }
    else mini.innerHTML = ICONOS[c.icono];
    row.querySelector("h3").textContent = p.n;
    if (p.tag) { var t = document.createElement("span"); t.className = "tag"; t.textContent = p.tag; row.querySelector("h3").appendChild(t); }
    row.querySelector("p").textContent = p.d;
    row.querySelector(".precio").textContent = p.precio == null ? "Precio según pedido" : dinero(p.precio);

    var ctl = row.querySelector(".ctl");
    if (p.precio == null) {
      var q = document.createElement("button"); q.className = "consultar"; q.textContent = "Consultar";
      q.onclick = function(){ enviar("Hola, quisiera consultar por: " + p.n); };
      ctl.appendChild(q);
    } else {
      pintarCtl(ctl, p);
    }
    lista.appendChild(row);
  });
  s.appendChild(lista);
  cont.appendChild(s);
});

var vacio = document.createElement("p");
vacio.className = "vacio"; vacio.hidden = true;
vacio.textContent = "No encontramos ese producto. Escríbenos y te decimos si lo tenemos.";
cont.appendChild(vacio);

var ficha = document.createElement("div");
ficha.className = "ficha";
ficha.innerHTML = '<h2>Visítanos</h2><div class="fila"><b>Dirección</b><span id="fDir"></span></div><div class="fila"><b>Horario</b><span id="fHor"></span></div>';
cont.appendChild(ficha);
$("fDir").textContent = N.direccion;
$("fHor").textContent = N.horario;
if (N.mapa) {
  var fm = document.createElement("div"); fm.className = "fila";
  fm.innerHTML = '<b>Cómo llegar</b><a target="_blank" rel="noopener">Abrir en Google Maps</a>';
  fm.querySelector("a").href = N.mapa;
  ficha.appendChild(fm);
}

var f = document.createElement("footer");
f.textContent = N.nombre + " · Precios referenciales";
cont.appendChild(f);

/* Pedido */
function pintarCtl(ctl, p){
  ctl.innerHTML = "";
  var n = carrito[p.key] ? carrito[p.key].cant : 0;
  if (n > 0) {
    var menos = document.createElement("button"); menos.className = "menos"; menos.textContent = "−";
    menos.setAttribute("aria-label", "Quitar " + p.n);
    menos.onclick = function(){ cambiar(p, -1, ctl); };
    var c = document.createElement("span"); c.className = "cant"; c.textContent = n;
    ctl.appendChild(menos); ctl.appendChild(c);
  }
  var mas = document.createElement("button"); mas.className = "mas"; mas.textContent = "+";
  mas.setAttribute("aria-label", "Agregar " + p.n);
  mas.onclick = function(){ cambiar(p, 1, ctl); };
  ctl.appendChild(mas);
}

function cambiar(p, d, ctl){
  var it = carrito[p.key] || { p:p, cant:0 };
  it.cant += d;
  if (it.cant <= 0) delete carrito[p.key]; else carrito[p.key] = it;
  pintarCtl(ctl, p);
  resumen();
  var a = $("wa"); a.classList.add("pulso"); setTimeout(function(){ a.classList.remove("pulso"); }, 150);
}

function resumen(){
  var items = Object.keys(carrito).map(function(k){ return carrito[k]; });
  var cant = 0, total = 0;
  items.forEach(function(it){ cant += it.cant; total += it.cant * it.p.precio; });
  var bolsa = $("bolsa");
  if (cant > 0) {
    bolsa.textContent = cant;
    $("waTxt").textContent = "Enviar pedido";
    $("total").textContent = dinero(total);
  } else {
    bolsa.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/></svg>';
    $("waTxt").textContent = "Pedir por WhatsApp";
    $("total").textContent = "";
  }
}

function enviar(texto){
  if (!N.whatsapp) {
    alert("Esto es un ejemplo.\n\nEn la versión de tu negocio, este botón abre tu WhatsApp con el pedido ya escrito:\n\n" + texto);
    return;
  }
  window.open("https://wa.me/" + N.whatsapp + "?text=" + encodeURIComponent(texto), "_blank");
}

$("wa").onclick = function(ev){
  ev.preventDefault();
  var items = Object.keys(carrito).map(function(k){ return carrito[k]; });
  if (!items.length) { enviar("Hola " + N.nombre + ", quisiera hacer un pedido."); return; }
  var total = 0, lineas = items.map(function(it){
    total += it.cant * it.p.precio;
    return "• " + it.cant + " x " + it.p.n + " (" + dinero(it.cant * it.p.precio) + ")";
  });
  enviar("Hola " + N.nombre + ", quisiera pedir:\n" + lineas.join("\n") + "\nTotal: " + dinero(total));
};

/* Buscador */
$("q").addEventListener("input", function(){
  var t = this.value.trim().toLowerCase(), hay = 0;
  document.querySelectorAll("section").forEach(function(s){
    var vis = 0;
    s.querySelectorAll(".prod").forEach(function(r){
      var ok = !t || r.dataset.buscar.indexOf(t) > -1;
      r.hidden = !ok; if (ok) vis++;
    });
    s.hidden = vis === 0; hay += vis;
  });
  dz.hidden = !!t;
  vacio.hidden = hay > 0;
});

/* Pestaña activa al hacer scroll */
var botones = tabs.querySelectorAll("button");
window.addEventListener("scroll", function(){
  var actual = N.categorias[0].id;
  N.categorias.forEach(function(c){ if ($(c.id).getBoundingClientRect().top < 140) actual = c.id; });
  botones.forEach(function(b){ b.classList.toggle("activo", b.dataset.ir === actual); });
}, { passive:true });

resumen();
</script>
